<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F8F6F2"/>
  <ellipse cx="300" cy="470" rx="180" ry="20" fill="#000" opacity="0.12"/>
  <!-- Chanel Classic Flap Quilted Bag -->
  <rect x="110" y="210" width="380" height="250" rx="14" fill="#141414"/>
  <path d="M 110 210 L 490 210 L 470 360 C 350 390, 250 390, 130 360 Z" fill="#222"/>
  <!-- Diamond Quilt Pattern -->
  <path d="M 110 240 L 490 380 M 110 300 L 410 460 M 210 210 L 490 320 M 310 210 L 490 280
           M 490 240 L 110 380 M 490 300 L 190 460 M 390 210 L 110 320 M 290 210 L 110 280"
        stroke="#333" stroke-width="2" fill="none"/>
  <!-- Interlocking CC Lock -->
  <g transform="translate(300, 360)">
    <circle cx="-10" cy="0" r="16" stroke="#B29A6A" stroke-width="5" fill="none"/>
    <circle cx="10" cy="0" r="16" stroke="#B29A6A" stroke-width="5" fill="none"/>
  </g>
  <!-- Leather Woven Chain Strap -->
  <path d="M 150 210 Q 300 70 450 210" stroke="#B29A6A" stroke-width="7" stroke-dasharray="10 4" fill="none"/>
</svg>