<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F6F4F0"/>
  <ellipse cx="300" cy="470" rx="180" ry="20" fill="#000" opacity="0.1"/>
  <!-- Loewe Puzzle Geometric Bag -->
  <g transform="translate(100, 200)">
    <!-- Geometric Leather Paneling -->
    <polygon points="0,60 220,0 380,80 180,140" fill="#C28D5E"/>
