<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <rect width="1000" height="700" fill="#EFECE6"/>
  <!-- Boutique Architecture Graphic -->
  <rect x="150" y="100" width="700" height="500" fill="#222120"/>
  <rect x="200" y="150" width="280" height="400" fill="#171717" stroke="#B29A6A" stroke-width="2"/>
  <rect x="520" y="150" width="280" height="400" fill="#171717" stroke="#B29A6A" stroke-width="2"/>
  <!-- Windows Warm Glow -->
  <rect x="220" y="200" width="240" height="300" fill="#F7F5F1" opacity="0.9"/>
  <rect x="540" y="200" width="240" height="300" fill="#F7F5F1" opacity="0.9"/>
  <!-- Display Pedestals -->
  <rect x="270" y="380" width="140" height="120" fill="#222"/>
  <rect x="590" y="380" width="140" height="120" fill="#222"/>
  <!-- Bag Silhouettes inside store display -->
  <path d="M 310 330 L 370 330 L 380 380 L 300 380 Z" fill="#171717"/>
  <path d="M 630 330 L 690 330 L 700 380 L 620 380 Z" fill="#6F1D2A"/>
  <!-- Store Name Header -->
  <text x="500" y="75" font-family="'Times New Roman', serif" font-size="28" fill="#171717" text-anchor="middle" letter-spacing="3">TABRIZ BOUTIQUE STORE</text>
</svg>