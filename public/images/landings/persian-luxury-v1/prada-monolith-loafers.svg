<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F8F6F2"/>
  <ellipse cx="300" cy="480" rx="200" ry="24" fill="#000" opacity="0.15"/>
  <!-- Chunky Monolith Platform Sole Loafer -->
  <g transform="translate(80, 220)">
    <!-- Heavy Treaded Sole -->
    <path d="M 40 220 L 400 220 C 420 220, 440 210, 440 180 L 420 160 L 20 160 Z" fill="#111"/>
    <!-- Lug treads -->
    <rect x="50" y="220" width="30" height="20" fill="#171717"/>
    <rect x="110" y="220" width="30" height="20" fill="#171717"/>
    <rect x="170" y="220" width="30" height="20" fill="#171717"/>
    <rect x="230" y="220" width="30" height="20" fill="#171717"/>
    <rect x="290" y="220" width="30" height="20" fill="#171717"/>
    <rect x="350" y="220" width="30" height="20" fill="#171717"/>
    <!-- Glossy Leather Loafer Upper -->
    <path d="M 40 160 Q 180 150 280 80 Q 360 90 420 160 Z" fill="#1C1C1C"/>
    <path d="M 120 130 C 180 100, 260 90, 310 120 Z" fill="#2E2E2E"/>
    <!-- Prada Triangle Logo -->
    <polygon points="250,110 230,85 270,85" fill="#B29A6A"/>
  </g>
</svg>