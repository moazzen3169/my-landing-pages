<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F8F6F2"/>
  <ellipse cx="300" cy="480" rx="160" ry="20" fill="#000" opacity="0.12"/>
  <!-- Lady Dior Cannage Quilted Boxy Bag -->
  <rect x="130" y="220" width="340" height="250" rx="12" fill="#171717"/>
  <!-- Cannage Grid Stitching -->
  <path d="M 130 250 L 470 410 M 130 310 L 470 470 M 130 370 L 330 470 M 230 220 L 470 340 M 330 220 L 470 290
           M 470 250 L 130 410 M 470 310 L 130 470 M 470 370 L 270 470 M 370 220 L 130 340 M 270 220 L 130 290"
        stroke="#2E2E2E" stroke-width="2" fill="none"/>
  <!-- Rigid Arch Handles -->
  <path d="M 210 220 C 210 120, 390 120, 390 220" stroke="#171717" stroke-width="18" fill="none"/>
  <!-- DIOR Letter Charms -->
  <g transform="translate(390, 240)">
    <circle cx="10" cy="20" r="12" fill="#B29A6A"/>
    <text x="10" y="25" font-family="serif" font-size="12" font-weight="bold" fill="#171717" text-anchor="middle">D</text>
    <circle cx="28" cy="38" r="10" fill="#B29A6A"/>
    <text x="28" y="42" font-family="serif" font-size="10" font-weight="bold" fill="#171717" text-anchor="middle">I</text>
    <circle cx="12" cy="54" r="11" fill="#B29A6A"/>
    <text x="12" y="58" font-family="serif" font-size="11" font-weight="bold" fill="#171717" text-anchor="middle">O</text>
    <circle cx="-6" cy="38" r="10" fill="#B29A6A"/>
    <text x="-6" y="42" font-family="serif" font-size="10" font-weight="bold" fill="#171717" text-anchor="middle">R</text>
  </g>
</svg>