<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#F8F6F2"/>
  <ellipse cx="300" cy="470" rx="190" ry="20" fill="#000" opacity="0.12"/>
  <!-- YSL Chevron Quilted Flap Bag -->
  <rect x="100" y="200" width="400" height="260" rx="12" fill="#1C1C1C"/>
  <!-- Quilt Lines -->
  <path d="M 100 200 L 300 340 L 500 200 M 100 240 L 300 380 L 500 240 M 100 280 L 300 420 L 500 280" stroke="#333" stroke-width="3" fill="none"/>
  <!-- YSL Metal Logo Monogram -->
  <g transform="translate(280, 270)">
    <text x="20" y="50" font-family="'Times New Roman', serif" font-size="54" font-weight="bold" fill="#B29A6A" text-anchor="middle">YSL</text>
  </g>
  <!-- Chain Strap -->
  <path d="M 130 200 Q 300 60 470 200" stroke="#B29A6A" stroke-width="7" stroke-dasharray="12 4" fill="none"/>
</svg>