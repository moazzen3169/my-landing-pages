<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_AIR_MAX_DN_LUXE" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#C8D1CE" />
      <stop offset="100%" stop-color="#ADB7B4" />
    </radialGradient>
    <filter id="softShadow_AIR_MAX_DN_LUXE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="soleGrad_AIR_MAX_DN_LUXE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="50%" stop-color="#3A3A3A" />
      <stop offset="100%" stop-color="#A89B84" />
    </linearGradient>
    <linearGradient id="upperGrad_AIR_MAX_DN_LUXE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#bgGrad_AIR_MAX_DN_LUXE)" />

  <!-- Studio Floor Ellipse Shadow -->
  <ellipse cx="400" cy="480" rx="280" ry="24" fill="#000" opacity="0.12" filter="blur(10px)" />
  <ellipse cx="400" cy="475" rx="220" ry="14" fill="#000" opacity="0.18" filter="blur(6px)" />

  <!-- Sneaker Graphic Group -->
  <g transform="translate(400, 290) rotate(-6) translate(-360, -200)" filter="url(#softShadow_AIR_MAX_DN_LUXE)">

    <!-- Outer Midsole -->
    <path d="M 120,330 C 120,330 180,360 280,360 C 380,360 480,355 580,320 C 610,310 630,280 620,250 C 600,240 560,245 520,250 C 420,260 320,265 220,250 C 160,240 130,270 120,330 Z" fill="#A89B84" opacity="0.9" />

    <!-- Main Midsole Layer -->
    <path d="M 125,325 C 190,350 290,350 390,345 C 490,340 570,315 610,275 C 600,260 560,262 500,265 C 400,270 290,270 200,260 C 150,255 130,280 125,325 Z" fill="#111111" />

    <!-- Air Cushioning Windows -->
    <g fill="#A89B84" opacity="0.85">
      <rect x="220" y="305" width="45" height="18" rx="9" />
      <rect x="280" y="310" width="50" height="18" rx="9" />
      <rect x="340" y="310" width="50" height="18" rx="9" />
      <rect x="400" y="305" width="45" height="18" rx="9" />
    </g>

    <!-- Upper Body Mesh -->
    <path d="M 140,270 C 170,220 220,170 300,150 C 360,135 430,160 490,200 C 530,225 570,245 605,260 C 560,268 480,268 380,262 C 280,256 180,255 140,270 Z" fill="url(#upperGrad_AIR_MAX_DN_LUXE)" />

    <!-- Overlay Panels -->
    <path d="M 220,260 C 260,210 320,180 390,175 C 440,172 480,195 520,225 C 470,235 400,240 320,238 C 260,236 230,248 220,260 Z" fill="#3A3A3A" opacity="0.9" />

    <!-- Heel Counter -->
    <path d="M 140,270 C 130,230 145,185 185,160 C 215,140 250,150 275,185 C 240,210 180,240 140,270 Z" fill="#111111" />
    <path d="M 180,165 C 195,145 225,140 245,160 C 220,185 195,190 180,165 Z" fill="#A89B84" />

    <!-- Dynamic Motif -->
    <path d="M 260,230 C 330,190 420,190 510,235 C 460,220 380,210 300,225 Z" fill="#A89B84" opacity="0.95" />

    <!-- Lacing -->
    <g stroke="#111111" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="330" y1="170" x2="350" y2="200" />
      <line x1="360" y1="175" x2="380" y2="205" />
      <line x1="390" y1="182" x2="410" y2="210" />
      <line x1="420" y1="190" x2="440" y2="218" />
      <line x1="450" y1="200" x2="470" y2="225" />
    </g>

    <!-- Outsole Details -->
    <path d="M 120,330 C 130,345 160,355 200,358 L 195,368 C 150,365 125,350 115,335 Z" fill="#111" />
    <path d="M 520,335 C 560,325 595,305 615,280 L 622,290 C 600,318 560,338 515,348 Z" fill="#111" />
  </g>

  <!-- Watermark Text -->
  <text x="50%" y="11%" text-anchor="middle" fill="#111111" opacity="0.08" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="12">SOLEA</text>
  <text x="50%" y="92%" text-anchor="middle" fill="#111111" opacity="0.3" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="4">SOLEA STUDIO ARCHIVE — AIR MAX DN LUXE</text>
</svg>